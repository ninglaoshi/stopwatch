<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Cross-country timers</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f2f5f9;color:#1e2c40;font:14px system-ui,sans-serif}main{max-width:1250px;margin:20px auto;padding:0 20px}header{display:flex;align-items:baseline;gap:18px;margin-bottom:16px}h1{font-size:25px;margin:0}header span,footer{color:#69768a;font-size:12px}.toolbar{display:flex;gap:8px;margin-bottom:16px}input,button{font:inherit;border-radius:6px}input{min-width:0;border:1px solid #cbd5e2;padding:8px 10px}#newName{width:240px}button{border:0;padding:8px 12px;font-weight:650;cursor:pointer;background:#e8edf4;color:#2b3c54}button:hover{filter:brightness(.95)}button:disabled{opacity:.4;cursor:default}button:focus-visible,input:focus-visible{outline:3px solid #8db9ff;outline-offset:2px}.blue{background:#2864d5;color:white}.green{background:#157b59;color:white}#startAll{margin-left:auto}.layout{display:grid;grid-template-columns:minmax(540px,1.65fr) minmax(280px,1fr);gap:18px}.panel{background:white;border:1px solid #dbe2ec;border-radius:10px;overflow:hidden}.heading{height:42px;padding:11px 14px;background:#f8fafd;border-bottom:1px solid #e4e9f1;display:flex;justify-content:space-between;font-weight:650}.row{display:grid;grid-template-columns:minmax(95px,1fr) 132px 66px 82px 28px;gap:8px;align-items:center;padding:7px 12px;min-height:47px;border-bottom:1px solid #edf0f5}.row:last-child{border-bottom:0}.name{width:100%;padding:5px 6px;border-color:transparent;font-weight:600}.name:hover,.name:focus{border-color:#cbd5e2}.time{font:600 18px ui-monospace,monospace;font-variant-numeric:tabular-nums}.row.done{background:#f0faf5}.row.running .time{color:#2864d5}.remove{padding:5px;background:transparent;color:#8c6973;font-size:18px}.empty{padding:30px 16px;color:#748096;text-align:center}table{width:100%;border-collapse:collapse;font-size:14px}th{text-align:left;color:#748096;font-size:11px;text-transform:uppercase;letter-spacing:.06em;padding:10px 12px}td{padding:11px 12px;border-top:1px solid #edf0f5}td:last-child,th:last-child{text-align:right;white-space:nowrap}td:last-child{font-family:ui-monospace,monospace}td:nth-child(2){overflow-wrap:anywhere}.place{color:#748096;width:38px}.heading button{font-size:11px;padding:3px 7px;margin-top:-3px}footer{margin-top:12px}@media(max-width:900px){.layout{grid-template-columns:1fr}header span{display:none}}@media(max-width:540px){main{padding:0 10px}.toolbar{flex-wrap:wrap}#newName{flex:1;width:140px}.row{grid-template-columns:minmax(70px,1fr) 108px 54px 68px 20px;gap:4px;padding:7px 6px}.row button{font-size:12px;padding:8px 5px}.time{font-size:15px}}
</style></head><body><main>
<header><h1>Cross-country timers</h1><span>One runner per row. One click at the finish line.</span></header>
<form class="toolbar" id="add"><input id="newName" placeholder="Runner’s name" aria-label="New runner name" maxlength="100" autocomplete="off"><button class="blue">+ Add runner</button><button type="button" class="green" id="startAll">Start All</button><button type="button" id="newRace">New race</button></form>
<div class="layout"><section class="panel"><div class="heading"><span>Runners</span><span id="count"></span></div><div id="watches"></div></section><section class="panel"><div class="heading"><span>Finish results · fastest first</span><button id="copy" type="button">Copy results</button></div><div id="results" aria-live="polite"></div></section></div>
<footer id="note">Click a name to edit it. Timers and results save in this browser. New race clears times and keeps your runners.</footer>
</main><script>
'use strict';
const key='named-stopwatches-v1',resultsKey='runner-results-v1';let watches=[],results=[];
try{const saved=JSON.parse(localStorage.getItem(key)||'[]');if(Array.isArray(saved))watches=saved.filter(w=>typeof w.id==='string'&&typeof w.name==='string'&&Number.isFinite(w.elapsed)&&w.elapsed>=0&&(w.started===null||Number.isFinite(w.started)));const r=JSON.parse(localStorage.getItem(resultsKey)||'[]');if(Array.isArray(r))results=r.filter(x=>typeof x.id==='string'&&typeof x.name==='string'&&Number.isFinite(x.time)&&x.time>=0);}catch(e){}
const list=document.getElementById('watches');
function save(){try{localStorage.setItem(key,JSON.stringify(watches));localStorage.setItem(resultsKey,JSON.stringify(results));}catch(e){document.getElementById('note').textContent='Storage is unavailable. Keep this page open to retain timers and results.';}}
function elapsed(w,now=Date.now()){return w.elapsed+(w.started===null?0:Math.max(0,now-w.started));}
function format(ms){const n=Math.floor(ms/10);return [Math.floor(n/360000),Math.floor(n/6000)%60,Math.floor(n/100)%60].map(v=>String(v).padStart(2,'0')).join(':')+'.'+String(n%100).padStart(2,'0');}
function sorted(){return [...results].sort((a,b)=>a.time-b.time);}
function button(text,cls,action,disabled=false){const b=document.createElement('button');b.type='button';b.textContent=text;b.className=cls;b.disabled=disabled;b.onclick=action;return b;}
function renderResults(){const box=document.getElementById('results');box.replaceChildren();if(!results.length){const e=document.createElement('div');e.className='empty';e.textContent='Finished runners will appear here.';box.append(e);return;}const table=document.createElement('table');const head=table.createTHead().insertRow();for(const title of ['Place','Runner','Time']){const th=document.createElement('th');th.textContent=title;head.append(th);}const body=table.createTBody();sorted().forEach((r,i)=>{const row=body.insertRow();[i+1,r.name,format(r.time)].forEach((value,j)=>{const td=row.insertCell();td.textContent=value;if(j===0)td.className='place';});});box.append(table);}
function render(){list.replaceChildren();document.getElementById('count').textContent=watches.length+' runners';document.getElementById('startAll').disabled=!watches.some(w=>!w.finished&&w.started===null);if(!watches.length){const e=document.createElement('div');e.className='empty';e.textContent='Add your runners above, then click Start All.';list.append(e);}for(const w of watches){const row=document.createElement('div');row.className='row'+(w.finished?' done':w.started!==null?' running':'');const name=document.createElement('input');name.className='name';name.value=w.name;name.maxLength=100;name.setAttribute('aria-label','Runner name');name.onchange=()=>{w.name=name.value.trim()||'Unnamed runner';name.value=w.name;const r=results.find(r=>r.id===w.id);if(r)r.name=w.name;save();renderResults();};const time=document.createElement('span');time.className='time';time.dataset.id=w.id;time.textContent=format(elapsed(w));const start=button('Start','blue',()=>{w.started=Date.now();save();render();},w.finished||w.started!==null);const finish=button('Finished','green',()=>{const now=Date.now();w.elapsed=elapsed(w,now);w.started=null;w.finished=true;results.push({id:w.id,name:w.name,time:w.elapsed});save();render();},w.finished||w.started===null);const remove=button('×','remove',()=>{if(confirm('Remove '+w.name+' from the runner list? Recorded results will stay.')){watches=watches.filter(x=>x.id!==w.id);save();render();}});remove.setAttribute('aria-label','Remove '+w.name);row.append(name,time,start,finish,remove);list.append(row);}renderResults();}
 document.getElementById('add').onsubmit=e=>{e.preventDefault();const input=document.getElementById('newName');watches.push({id:crypto.randomUUID(),name:input.value.trim()||'Runner '+(watches.length+1),elapsed:0,started:null,finished:false});input.value='';save();render();input.focus();};
document.getElementById('startAll').onclick=()=>{const now=Date.now();for(const w of watches)if(!w.finished&&w.started===null)w.started=now;save();render();};
document.getElementById('newRace').onclick=()=>{if((results.length||watches.some(w=>w.started!==null||w.elapsed>0))&&!confirm('Start a new race? All times and results will be cleared; runner names will stay.'))return;for(const w of watches){w.elapsed=0;w.started=null;w.finished=false;}results=[];save();render();};
document.getElementById('copy').onclick=async()=>{const text=['Place\tRunner\tTime',...sorted().map((r,i)=>`${i+1}\t${r.name}\t${format(r.time)}`)].join('\n');try{await navigator.clipboard.writeText(text);const b=document.getElementById('copy');b.textContent='Copied!';setTimeout(()=>b.textContent='Copy results',1500);}catch(e){prompt('Copy your results:',text);}};
setInterval(()=>{for(const node of list.querySelectorAll('.time')){const w=watches.find(w=>w.id===node.dataset.id);if(w&&w.started!==null)node.textContent=format(elapsed(w));}},40);render();
</script></body></html>
